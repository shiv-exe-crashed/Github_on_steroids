<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Animated demo of the setup wizard: it asks for two profiles and creates a launcher for each.">
  <style>
    .mono { font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; white-space: pre; }
    .t { fill: #c9d1d9; } .d { fill: #8b949e; } .a { fill: #79c0ff; font-weight: 700; }
    .ok { fill: #3fb950; font-weight: 700; } .p { fill: #d2a8ff; } .h { fill: #ffffff; font-weight: 700; }
    .l { opacity: 0; animation: show .3s ease forwards; }
    @keyframes show { to { opacity: 1; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="900" height="600" rx="16" fill="#0d1117"/>
  <rect width="900" height="44" rx="16" fill="#161b22"/>
  <rect y="28" width="900" height="16" fill="#161b22"/>
  <circle cx="26" cy="22" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="22" r="7" fill="#febc2e"/>
  <circle cx="74" cy="22" r="7" fill="#28c840"/>
  <text x="450" y="27" text-anchor="middle" class="mono d" font-size="14">install-mac.command</text>

  <g class="mono" xml:space="preserve">
    <text x="28" y="84" class="l" style="animation-delay:.2s"><tspan class="ok">❯</tspan><tspan class="t"> double-click install-mac.command</tspan></text>
    <text x="28" y="118" class="l h" style="animation-delay:.8s">GitHub Desktop Profiles setup</text>
    <text x="28" y="146" class="l" style="animation-delay:1.2s"><tspan class="t">GitHub Desktop: found, and signed by GitHub. </tspan><tspan class="ok">✓</tspan></text>
    <text x="28" y="182" class="l" style="animation-delay:1.9s"><tspan class="d">Copy your current GitHub Desktop into your first profile? (y/n) [y]: </tspan><tspan class="a">y</tspan></text>
    <text x="28" y="210" class="l" style="animation-delay:2.6s"><tspan class="d">Name for profile 1: </tspan><tspan class="a">personal</tspan></text>
    <text x="50" y="238" class="l" style="animation-delay:3.2s"><tspan class="d">Email on commits for this account: </tspan><tspan class="a">you@users.noreply.github.com</tspan></text>
    <text x="50" y="266" class="l" style="animation-delay:3.8s"><tspan class="d">GitHub owners for this account: </tspan><tspan class="a">your-username</tspan></text>
    <text x="28" y="302" class="l" style="animation-delay:4.5s"><tspan class="d">Add another profile (another GitHub account)? (y/n) [y]: </tspan><tspan class="a">y</tspan></text>
    <text x="28" y="330" class="l" style="animation-delay:5.1s"><tspan class="d">Name for profile 2: </tspan><tspan class="a">work</tspan></text>
    <text x="50" y="358" class="l" style="animation-delay:5.7s"><tspan class="d">Email on commits for this account: </tspan><tspan class="a">you@company.com</tspan></text>
    <text x="50" y="386" class="l" style="animation-delay:6.3s"><tspan class="d">GitHub owners for this account: </tspan><tspan class="a">your-company</tspan></text>
    <text x="28" y="422" class="l" style="animation-delay:7.0s"><tspan class="d">Create these profiles? (y/n) [y]: </tspan><tspan class="a">y</tspan></text>
    <text x="28" y="458" class="l" style="animation-delay:7.8s"><tspan class="ok">✓ Ready: </tspan><tspan class="t">personal  →  ~/Applications/GitHub Desktop - personal.app</tspan></text>
    <text x="28" y="486" class="l" style="animation-delay:8.2s"><tspan class="ok">✓ Ready: </tspan><tspan class="t">work      →  ~/Applications/GitHub Desktop - work.app</tspan></text>
    <text x="28" y="522" class="l" style="animation-delay:8.8s"><tspan class="p">"personal" opens already signed in, with your repos. </tspan><tspan class="h">Done.</tspan></text>
    <text x="28" y="558" class="l" style="animation-delay:9.2s"><tspan class="ok">❯</tspan><tspan class="t cursor"> █</tspan></text>
  </g>
</svg>
